[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent"
version = "0.1.0"
description = "Foundation for an algorithmic trading research system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3.0",
    "yfinance>=0.2,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
